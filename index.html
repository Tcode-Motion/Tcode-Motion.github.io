<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechScript | Test Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
            border: 1px solid #334155;

        p {
            color: #94a3b8;

        .status {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: #065f46;
            color: #34d399;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
        }

</head>
<body>

    <div class="container">
        <h1>TechScript Test Page</h1>
        <p>If you can see this, your GitHub Pages hosting is officially live!</p>
